<button (click)="Toogle()" class="xxs:p-[6px] md:w-[160px] md:h-[50px] xl:h-[50px] lg:h-[50px] text-white bg-blue-400 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Agregar Comentario</button>

    <button class="bg-gray-800 text-white p-2 h-[65px] border rounded">Enviar</button>
