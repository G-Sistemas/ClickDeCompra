<!-- component -->
    <div class="p-2">
      <ngx-skeleton-loader 
        class="rounded-t-lg object-cover"
        [theme]="{ 'border-radius': '0.5rem', height: '14.2rem' }">
      </ngx-skeleton-loader>
    </div>
    
    <div class="px-5 pb-5">
      
      <ngx-skeleton-loader 
        class="mb-0"
        [theme]="{ height: '1.1rem', width: '75%', 'border-radius': '0.25rem' }">
      </ngx-skeleton-loader>
      
      <div class="flex items-center space-x-1 rtl:space-x-reverse">
        <ngx-skeleton-loader 
          *ngFor="let star of [1,2,3,4,5]" 
          [theme]="{ height: '1.2rem', width: '1.25rem', 'border-radius': '0.25rem' }"
          class="rounded">
        </ngx-skeleton-loader>
        <ngx-skeleton-loader 
          [theme]="{ height: '1.2rem','margin-left': '.2rem' , width: '2rem', 'border-radius': '0.25rem' }">
        </ngx-skeleton-loader>
      </div>
      
      <div class="flex items-center gap-4">
        <ngx-skeleton-loader class="w-[150px] xss:w-[100px] xl:w-[150px] lg:w-[130px] md:w-[120px] sm:w-[140px]"
          [theme]="{ height: '3.1rem',padding: '1rem' , 'border-radius': '0.5rem' }">
        </ngx-skeleton-loader>
        <ngx-skeleton-loader 
          class="w-[160px] xxs:w-[100px] xl:w-[160px] lg:w-[140px] md:w-[130px] sm:w-[150px]"
          [theme]="{ height: '3.1rem',padding: '1rem', 'border-radius': '0.5rem' }">
        </ngx-skeleton-loader>
      </div>
    </div>
