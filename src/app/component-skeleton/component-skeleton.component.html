<!-- component -->
<div *ngFor="let sk of [1,2,3,4,5]" class="xxs:w-[340px] xxs:h-[390px]  w-full m-5 max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 mb-6">
    
    <div class="p-2">
      <ngx-skeleton-loader 
        class="rounded-t-lg object-cover"
        [theme]="{ 'border-radius': '0.5rem', height: '14.2rem' }">
      </ngx-skeleton-loader>
    </div>
    
    <div class="px-5 pb-5">
      
      <ngx-skeleton-loader 
        class="mb-0"
        [theme]="{ height: '1.1rem', width: '75%', 'border-radius': '0.25rem' }">
      </ngx-skeleton-loader>
      
      <div class="flex items-center space-x-1 rtl:space-x-reverse">
        <ngx-skeleton-loader 
          *ngFor="let star of [1,2,3,4,5]" 
          [theme]="{ height: '1.2rem', width: '1.25rem', 'border-radius': '0.25rem' }"
          class="rounded">
        </ngx-skeleton-loader>
        <ngx-skeleton-loader 
          [theme]="{ height: '1.2rem', width: '2rem', 'border-radius': '0.25rem' }">
        </ngx-skeleton-loader>
      </div>
      
      <div class="flex items-center justify-between">
        <ngx-skeleton-loader 
          [theme]="{ height: '1.2rem', width: '9rem',padding: '1rem' , 'border-radius': '0.5rem' }">
        </ngx-skeleton-loader>
        <ngx-skeleton-loader 
          class="xxs:ml-2"
          [theme]="{ height: '1.1rem',padding: '1rem', width: '9.5rem', 'border-radius': '0.5rem' }">
        </ngx-skeleton-loader>
      </div>
    </div>
  </div>
